<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto Path Visualizer — Team 7840</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #12121e; color: #e0e0e0; padding: 20px; }
h1 { font-size: 1.25em; color: #a8d0ff; margin-bottom: 4px; }
.subtitle { font-size: 0.82em; color: #778; margin-bottom: 14px; }
.controls { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
.sep { width: 1px; height: 26px; background: #334; margin: 0 4px; }
.lbl { font-size: 0.80em; color: #778; }
.btn { padding: 7px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.88em;
       font-weight: 700; letter-spacing: .03em; transition: all .15s; outline: 2px solid transparent; }
.btn-route  { background: #2a2a3e; color: #aab; }
.btn-route:hover, .btn-route.active { background: #3a4a70; color: #fff; outline-color: #4a7fff; }
.btn-blue   { background: #1e4dcc; color: #fff; }
.btn-blue:hover, .btn-blue.active   { background: #3a7fff; outline-color: #3a7fff; }
.btn-red    { background: #aa1a1a; color: #fff; }
.btn-red:hover,  .btn-red.active    { background: #ff3333; outline-color: #ff3333; }
svg { display: block; border-radius: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
.li { display: flex; align-items: center; gap: 7px; font-size: 0.80em; color: #bbb; }
.sw { width: 28px; height: 3px; border-radius: 2px; flex-shrink: 0; }
table { margin-top: 16px; border-collapse: collapse; font-size: 0.80em; width: 100%; max-width: 920px; }
th { background: #1e2a40; color: #a8d0ff; padding: 6px 10px; text-align: left; border-bottom: 1px solid #334; }
td { padding: 5px 10px; border-bottom: 1px solid #222; color: #ccc; }
tr:hover td { background: rgba(255,255,255,.04); }
td:first-child { font-weight: 700; color: #fff; }
</style>
</head>
<body>
<h1 id="title">Auto Path Visualizer — Team 7840</h1>
<p class="subtitle" id="subtitle"></p>
<div class="controls">
  <span class="lbl">Route:</span>
  <button class="btn btn-route active" id="btnOutpostOnly"  onclick="setRoute('outpost-only')">Outpost Auto</button>
  <button class="btn btn-route"         id="btnOutpost"     onclick="setRoute('outpost')">Trench → Outpost</button>
  <button class="btn btn-route"        id="btnCycleRight"  onclick="setRoute('cycle-right')">Cycle RIGHT</button>
  <button class="btn btn-route"        id="btnCycleLeft"   onclick="setRoute('cycle-left')">Cycle LEFT</button>
  <div class="sep"></div>
  <span class="lbl">Alliance:</span>
  <button class="btn btn-blue active" id="btnBlue" onclick="setAlliance('blue')">Blue</button>
  <button class="btn btn-red"         id="btnRed"  onclick="setAlliance('red')">Red</button>
</div>
<svg id="field"></svg>
<div class="legend" id="legend"></div>
<table><thead><tr><th>WP</th><th>Field X (m)</th><th>Field Y (m)</th><th>Heading</th><th>Description</th></tr></thead>
<tbody id="tb"></tbody></table>

<script>
// ── Field constants (meters) ──────────────────────────────────────────────
const FL = 16.54, FW = 8.07;
const HUB_SIDE = 1.1938, HUB_DIST = 3.9651;
const TR_DEPTH = 1.194, TR_WIDTH = 1.668, TR_BUF = 0.8;
const NEUT_STAG = 0.40, COLL_CLR = 0.85;
const COLL_DIST = 1.5 * 2.5;  // 3.75 m
const OUTPOST_W = 1.253, OUTPOST_DOCK = 0.7;

// ── SVG layout ────────────────────────────────────────────────────────────
const SC = 52, OX = 58, OY = 42;
const SVG_W = OX + FL * SC + 58;
const SVG_H = OY + FW * SC + 42;

function sx(x) { return OX + x * SC; }
function sy(y) { return OY + (FW - y) * SC; }

// ── Phases ────────────────────────────────────────────────────────────────
const PH_OUTPOST = [
  { name:'Outbound trench',                                                    c:'#c0c0c0', w:3,   dash:'10,5' },
  { name:'Transit → collection',                                               c:'#4a9eff', w:2.5, dash:''     },
  { name:'Collection sweep (out)',                                              c:'#22dd44', w:2.5, dash:''     },
  { name:'Return collect (alliance wall hdg, 5% offset X, rollers on)',        c:'#ffbb22', w:2.5, dash:''     },
  { name:'Transit → return trench staging (alliance wall hdg)',                c:'#ff7722', w:2.5, dash:''     },
  { name:'Approach trench edge (alliance wall hdg)',                           c:'#dd44cc', w:2.5, dash:'5,3'  },
  { name:'Return trench',                                                      c:'#c0c0c0', w:3,   dash:'10,5' },
  { name:'Transit → outpost',                                                  c:'#ff4466', w:2.5, dash:''     },
];

const PH_CYCLE = [
  { name:'Outbound trench',                                                    c:'#c0c0c0', w:3,   dash:'10,5' },
  { name:'Transit → collection',                                               c:'#4a9eff', w:2.5, dash:''     },
  { name:'Collection sweep (out)',                                              c:'#22dd44', w:2.5, dash:''     },
  { name:'Return collect (alliance→return wall hdg, 5% offset X, rollers on)',c:'#ffbb22', w:2.5, dash:''     },
  { name:'Transit → return trench staging (return hdg)',                       c:'#ff7722', w:2.5, dash:''     },
  { name:'Approach trench edge (return hdg)',                                  c:'#dd44cc', w:2.5, dash:'5,3'  },
  { name:'Return trench → stop → shoot 6 s → repeat',                         c:'#c0c0c0', w:3,   dash:'10,5' },
];

// SEGS: [fromWP, toWP, phaseIndex]
// Outpost: 10 WPs (0-9) → 9 segments; WP3→WP4 and WP4→WP5 both use phase 3 (return collect)
const SEGS_OUTPOST = [[0,1,0],[1,2,1],[2,3,2],[3,4,3],[4,5,3],[5,6,4],[6,7,5],[7,8,6],[8,9,7]];
// Cycle: 9 WPs (0-8) → 8 segments; same structure minus the outpost leg
const SEGS_CYCLE   = [[0,1,0],[1,2,1],[2,3,2],[3,4,3],[4,5,3],[5,6,4],[6,7,5],[7,8,6]];
const SEGS_OUTPOST_ONLY = [[0,1,0]];  // dynamic pathfind start → outpost

const PH_OUTPOST_ONLY = [
  { name:'Dynamic pathfind to outpost — deploy intake, shoot on the move', c:'#4a9eff', w:2.5, dash:'10,5' },
];

// ── Waypoint generators ───────────────────────────────────────────────────

/**
 * OutpostAutoCommand — no fixed path, just drive + shoot to outpost.
 * WP0 = representative start position in alliance zone.
 * WP1 = outpost dock pose (the only real target).
 */
function wps_outpost_only(isRed) {
  const hubX   = isRed ? FL - HUB_DIST : HUB_DIST;
  const startX = isRed ? hubX + 1.2 : hubX - 1.2;
  const startH = isRed ? 180 : 0;
  const oX     = isRed ? FL - OUTPOST_DOCK : OUTPOST_DOCK;
  const oY     = isRed ? FW - OUTPOST_W/2  : OUTPOST_W/2;
  const oH     = isRed ? 0 : 180;
  return [
    { x:startX, y:FW/2, h:startH, ph:0, d:'Approximate robot start — exact position unknown (pathfind launches from wherever robot is)' },
    { x:oX,     y:oY,   h:oH,     ph:0, d:'Outpost dock — pathfindToPose target; robot shoots on the move during approach, then keeps shooting at outpost' },
  ];
}

/** TrenchToOutpostAutoCommand — 10 WPs (0-9), RIGHT trench, allianceWallHeading for return. */
function wps_outpost(isRed) {
  const leftH = isRed ? -90 : 90;
  const revH  = isRed ?  90 : -90;  // 180° from leftH — faces opposite side wall
  const oppH  = isRed ? 180 :  0;
  const wallH = isRed ?   0 : 180;
  const hubX  = isRed ? FL - HUB_DIST : HUB_DIST;
  const ti    = isRed ? 1 : 0;  // RIGHT trench
  const trCY  = ti === 0 ? TR_WIDTH/2 : FW - TR_WIDTH/2;
  const trHX  = isRed ? hubX + TR_DEPTH/2 + TR_BUF : hubX - TR_DEPTH/2 - TR_BUF;
  const trNX  = isRed ? hubX - TR_DEPTH/2 - TR_BUF : hubX + TR_DEPTH/2 + TR_BUF;
  const nX    = trHX + 0.75 * (FL / 2 - trHX);  // 75% depth fraction
  const rX    = trHX + 0.95 * (nX - trHX);       // 5% toward hub for return sweep
  const cSY   = isRed ? FW - TR_WIDTH - COLL_CLR : TR_WIDTH + COLL_CLR;
  const cEY   = isRed ? cSY - COLL_DIST : cSY + COLL_DIST;
  const nsX   = isRed ? trNX - NEUT_STAG : trNX + NEUT_STAG;
  const oX    = isRed ? FL - OUTPOST_DOCK : OUTPOST_DOCK;
  const oY    = isRed ? FW - OUTPOST_W/2  : OUTPOST_W/2;
  return [
    { x:trHX, y:trCY, h:oppH,  ph:0, d:'WP0 — Hub-side staging — before outbound trench entry' },
    { x:trNX, y:trCY, h:oppH,  ph:1, d:'WP1 — Neutral-side exit — after outbound trench' },
    { x:nX,   y:cSY,  h:leftH, ph:2, d:'WP2 — Collection start (facing left wall)' },
    { x:nX,   y:cEY,  h:leftH, ph:2, d:'WP3 — Collection end (turnaround)' },
    { x:rX,   y:cEY,  h:wallH, ph:3, d:'WP4 — Turn to alliance wall, 5% toward hub, same Y as WP3 (NEW)' },
    { x:rX,   y:cSY,  h:revH,  ph:3, d:'WP5 — Return to collect-start Y, faces opposite side wall (was WP4)' },
    { x:nsX,  y:trCY, h:wallH, ph:4, d:'WP6 — Neutral-zone approach staging — alliance wall heading (was WP5)' },
    { x:trNX, y:trCY, h:wallH, ph:5, d:'WP7 — Return trench entry — alliance wall heading (was WP6)' },
    { x:trHX, y:trCY, h:wallH, ph:6, d:'WP8 — Hub-side exit — alliance wall heading (was WP7)' },
    { x:oX,   y:oY,   h:wallH, ph:7, d:'WP9 — Outpost — dock & shoot (was WP8)' },
  ];
}

/**
 * TrenchCycleAutoCommand — 9 WPs (0-8), returnHeading (opponent wall) for return trench.
 * New WP4/WP5 face allianceWallHeading (own wall) during return collect sweep.
 * isRight=true → RIGHT trench (Blue=bottom wall, Red=top wall)
 * isRight=false → LEFT trench  (Blue=top wall,   Red=bottom wall)
 */
function wps_cycle(isRight, isRed, depthFraction) {
  // XOR: RIGHT+Blue or LEFT+Red sweep +Y; otherwise –Y
  const sweepPositiveY = isRight !== isRed;
  const leftH  = sweepPositiveY ?  90 : -90;
  const revH   = sweepPositiveY ? -90 :  90;  // 180° from leftH — faces opposite side wall (WP5)
  const wallH  = isRed ?   0 : 180;           // alliance wall heading (own wall) — WP4
  const retH   = isRed ? 180 :   0;           // opponent wall heading — WP6 onward

  const hubX  = isRed ? FL - HUB_DIST : HUB_DIST;
  // RIGHT: Blue=index 0 (bottom), Red=index 1 (top)
  // LEFT:  Blue=index 1 (top),    Red=index 0 (bottom)
  const ti    = isRight ? (isRed ? 1 : 0) : (isRed ? 0 : 1);
  const trCY  = ti === 0 ? TR_WIDTH/2 : FW - TR_WIDTH/2;
  const trHX  = isRed ? hubX + TR_DEPTH/2 + TR_BUF : hubX - TR_DEPTH/2 - TR_BUF;
  const trNX  = isRed ? hubX - TR_DEPTH/2 - TR_BUF : hubX + TR_DEPTH/2 + TR_BUF;
  const nX    = trHX + depthFraction * (FL / 2 - trHX);  // depth fraction of hub→centre
  const rX    = trHX + 0.95 * (nX - trHX);               // 5% toward hub for return sweep
  const cSY   = sweepPositiveY ? TR_WIDTH + COLL_CLR : FW - TR_WIDTH - COLL_CLR;
  const cEY   = sweepPositiveY ? cSY + COLL_DIST : cSY - COLL_DIST;
  const nsX   = isRed ? trNX - NEUT_STAG : trNX + NEUT_STAG;
  const cycleLabel = depthFraction === 0.75 ? 'Cycle 1 (75%)' : 'Cycle 2 (50%)';

  return [
    { x:trHX, y:trCY, h:retH,  ph:0, d:`${cycleLabel}: WP0 — Hub-side staging / cycle end — before outbound trench` },
    { x:trNX, y:trCY, h:retH,  ph:1, d:`${cycleLabel}: WP1 — Neutral-side exit — after outbound trench` },
    { x:nX,   y:cSY,  h:leftH, ph:2, d:`${cycleLabel}: WP2 — Collection start (facing left wall)` },
    { x:nX,   y:cEY,  h:leftH, ph:2, d:`${cycleLabel}: WP3 — Collection end (turnaround)` },
    { x:rX,   y:cEY,  h:wallH, ph:3, d:`${cycleLabel}: WP4 — Turn to alliance wall, 5% toward hub, same Y as WP3 (NEW)` },
    { x:rX,   y:cSY,  h:revH,  ph:3, d:`${cycleLabel}: WP5 — Return to collect-start Y, faces opposite side wall (was WP4)` },
    { x:nsX,  y:trCY, h:retH,  ph:4, d:`${cycleLabel}: WP6 — Neutral-zone staging — return heading (was WP5)` },
    { x:trNX, y:trCY, h:retH,  ph:5, d:`${cycleLabel}: WP7 — Return trench entry — return heading (was WP6)` },
    { x:trHX, y:trCY, h:retH,  ph:6, d:`${cycleLabel}: WP8 — Hub-side exit — stop, shoot 6 s (was WP7)` },
  ];
}

function getWps(route, isRed) {
  if (route === 'outpost-only') return wps_outpost_only(isRed);
  if (route === 'outpost')      return wps_outpost(isRed);
  if (route === 'cycle-right')  return wps_cycle(true,  isRed, 0.75);
  /* cycle-left */              return wps_cycle(false, isRed, 0.75);
}

/** Returns cycle 2 (25% depth) waypoints for dual-cycle overlay. */
function getWps2(route, isRed) {
  if (route === 'cycle-right')  return wps_cycle(true,  isRed, 0.50);
  if (route === 'cycle-left')   return wps_cycle(false, isRed, 0.50);
  return null;
}

// ── Display offsets (separate overlapping WPs visually) ───────────────────

/** TrenchToOutpost: 10 WPs. WP0=WP8, WP1=WP7 share field XY; WP2/WP5 share Y but differ in X. */
function getDOFF_outpost(isRed) {
  const s = isRed ? -1 : 1;
  return [
    { dx: -16*s, dy: -8*s },  // WP0 (hub-side, outbound)
    { dx: -16*s, dy: -8*s },  // WP1 (neutral-side, outbound)
    { dx:   0,   dy:   0   },  // WP2 (collect start, neutralX)
    { dx:   0,   dy:   0   },  // WP3 (collect end — same Y as WP4, field X shows hub distance)
    { dx:   0,   dy:   0   },  // WP4 (same Y as WP3, returnX 5% closer to hub)
    { dx:   0,   dy:   0   },  // WP5 (same Y as WP2, returnX 5% closer to hub)
    { dx:   0,   dy:  0   },  // WP6 (neutral staging — was WP5)
    { dx:  16*s, dy:  8*s },  // WP7 (return trench entry — was WP6)
    { dx:  16*s, dy:  8*s },  // WP8 (hub-side exit — was WP7)
    { dx:   0,   dy:  0   },  // WP9 (outpost — was WP8)
  ];
}

/** Cycle: 9 WPs. WP0=WP8, WP1=WP7 share field XY; WP2/WP5 share Y but differ in X.
 *  dy_sign: -1 for RIGHT trench, +1 for LEFT (flips which wall to push toward). */
function getDOFF_cycle(isRight, isRed) {
  const s = isRed ? -1 : 1;
  const d = isRight ? -1 : 1;  // wall-side sign
  return [
    { dx: -16*s, dy:  d*8*s },  // WP0 (hub-side, outbound)
    { dx: -16*s, dy:  d*8*s },  // WP1 (neutral-side, outbound)
    { dx:   0,   dy:   0    },  // WP2 (collect start, neutralX)
    { dx:   0,   dy:   0    },  // WP3 (collect end — same Y as WP4, field X shows hub distance)
    { dx:   0,   dy:   0    },  // WP4 (same Y as WP3, returnX 5% closer to hub)
    { dx:   0,   dy:   0    },  // WP5 (same Y as WP2, returnX 5% closer to hub)
    { dx:   0,   dy:  0     },  // WP6 (neutral staging — was WP5)
    { dx:  16*s, dy: -d*8*s },  // WP7 (return trench entry — was WP6)
    { dx:  16*s, dy: -d*8*s },  // WP8 (hub-side exit — was WP7)
  ];
}

function getDOFF(route, isRed) {
  if (route === 'outpost-only') return [{ dx:0, dy:0 }, { dx:0, dy:0 }];
  if (route === 'outpost')      return getDOFF_outpost(isRed);
  if (route === 'cycle-right')  return getDOFF_cycle(true,  isRed);
  /* cycle-left */              return getDOFF_cycle(false, isRed);
}

// ── Segment path offsets (separate overlapping route lines) ───────────────
/**
 * tyo: Y offset for outbound/return trench lines (separates them visually).
 *   RIGHT trench with sweepPositiveY=true  (Blue RIGHT, Red LEFT): tyo=+6
 *   LEFT  trench with sweepPositiveY=false (Blue LEFT, Red RIGHT): tyo=-6
 */
function getSOFF(route, isRed) {
  // For outpost (RIGHT trench, Blue): sweepPositiveY=true → tyo=+6
  // For cycle-right Blue: same; cycle-right Red: sweepPositiveY=false → tyo=-6
  // For cycle-left Blue: sweepPositiveY=false → tyo=-6
  let sweepPositiveY;
  if (route === 'outpost' || route === 'cycle-right') {
    sweepPositiveY = !isRed;
  } else {
    sweepPositiveY = isRed;
  }
  const tyo = sweepPositiveY ? 6 : -6;
  return [
    { xo: 0, yo:  tyo },  // 0→1 outbound trench (separate from return trench line)
    { xo: 0, yo:  0   },  // 1→2
    { xo: 0, yo:  0   },  // 2→3 collect out
    { xo: 0, yo:  0   },  // 3→4 return collect WP3→WP4
    { xo: 0, yo:  0   },  // 4→5 return collect WP4→WP5
    { xo: 0, yo:  0   },  // 5→6 transit to staging
    { xo: 0, yo:  0   },  // 6→7 approach trench
    { xo: 0, yo: -tyo },  // 7→8 return trench (separate from outbound trench line)
    { xo: 0, yo:  0   },  // 8→9 → outpost
  ];
}

// ── Drawing helpers ───────────────────────────────────────────────────────
function arrow(cx, cy, hDeg, len, col) {
  const r = hDeg * Math.PI / 180;
  const ex = cx + Math.cos(r)*len, ey = cy - Math.sin(r)*len;
  const pr = r + Math.PI/2, aw = 4.5;
  const bx = ex - Math.cos(r)*8, by = ey + Math.sin(r)*8;
  const pts = [[ex,ey],[bx+Math.cos(pr)*aw,by-Math.sin(pr)*aw],[bx-Math.cos(pr)*aw,by+Math.sin(pr)*aw]]
    .map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"
            stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>
          <polygon points="${pts}" fill="${col}"/>`;
}

function wpCircle(cx, cy, col, phaseCol, n) {
  return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="13"
            fill="${col}" fill-opacity="0.88" stroke="${phaseCol}" stroke-width="2.2"/>
          <text x="${cx.toFixed(1)}" y="${(cy+4.5).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="11" font-weight="700" fill="white">${n}</text>`;
}

function midArrow(x1, y1, x2, y2, col, xo, yo) {
  const mx=(x1+x2)/2+xo, my=(y1+y2)/2+yo;
  const ang=Math.atan2(-(y2-y1),x2-x1);
  const ex=mx+Math.cos(ang)*7, ey=my-Math.sin(ang)*7;
  const pr=ang+Math.PI/2, aw=3.5;
  const bx=mx-Math.cos(ang)*5, by=my+Math.sin(ang)*5;
  const pts=[[ex,ey],[bx+Math.cos(pr)*aw,by-Math.sin(pr)*aw],[bx-Math.cos(pr)*aw,by+Math.sin(pr)*aw]]
    .map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<polygon points="${pts}" fill="${col}" opacity="0.9"/>`;
}

// ── Static field elements ─────────────────────────────────────────────────
function fieldSVG() {
  const hubXb = HUB_DIST, hubXr = FL - HUB_DIST;
  const hh = HUB_SIDE/2 * SC;
  let s = '';
  s += `<rect x="${sx(0)}" y="${sy(FW)}" width="${FL*SC}" height="${FW*SC}"
          fill="#2a4a35" stroke="#fff" stroke-width="2"/>`;
  s += `<rect x="${sx(0)}" y="${sy(FW)}" width="${(hubXb-HUB_SIDE/2)*SC}" height="${FW*SC}"
          fill="rgba(40,80,200,.18)"/>`;
  s += `<rect x="${sx(hubXr+HUB_SIDE/2)}" y="${sy(FW)}" width="${(FL-hubXr-HUB_SIDE/2)*SC}" height="${FW*SC}"
          fill="rgba(200,40,40,.18)"/>`;
  s += `<line x1="${sx(FL/2)}" y1="${sy(FW)}" x2="${sx(FL/2)}" y2="${sy(0)}"
          stroke="rgba(255,255,255,.18)" stroke-width="1" stroke-dasharray="7,5"/>`;
  for (const [hx, lbl] of [[hubXb,'HUB B'],[hubXr,'HUB R']]) {
    const rx=sx(hx)-hh, ry=sy(FW/2)-hh;
    s += `<rect x="${rx.toFixed(1)}" y="${ry.toFixed(1)}" width="${(HUB_SIDE*SC).toFixed(1)}" height="${(HUB_SIDE*SC).toFixed(1)}"
            fill="#555" stroke="#999" stroke-width="1.5"/>`;
    s += `<text x="${sx(hx).toFixed(1)}" y="${(sy(FW/2)+4).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="10" fill="#bbb">${lbl}</text>`;
  }
  for (const hx of [hubXb, hubXr]) {
    for (const cy of [TR_WIDTH/2, FW-TR_WIDTH/2]) {
      const tx=sx(hx-TR_DEPTH/2), tw=TR_DEPTH*SC, ty=sy(cy+TR_WIDTH/2), th=TR_WIDTH*SC;
      s += `<rect x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" width="${tw.toFixed(1)}" height="${th.toFixed(1)}"
              fill="#2a2a2a" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>`;
      s += `<text x="${(tx+tw/2).toFixed(1)}" y="${(ty+th/2+4).toFixed(1)}" text-anchor="middle"
              font-family="Arial" font-size="9" fill="#888">TRENCH</text>`;
    }
  }
  const oH = OUTPOST_W*SC;
  s += `<rect x="${sx(0)}" y="${sy(OUTPOST_W)}" width="${OUTPOST_DOCK*2*SC}" height="${oH.toFixed(1)}"
          fill="rgba(255,220,0,.22)" stroke="#ffe066" stroke-width="1.2"/>`;
  s += `<text x="${(sx(0)+OUTPOST_DOCK*SC).toFixed(1)}" y="${(sy(OUTPOST_W/2)+4).toFixed(1)}" text-anchor="middle"
          font-family="Arial" font-size="9" fill="#ffe066">OUTPOST</text>`;
  s += `<rect x="${sx(FL-OUTPOST_DOCK*2)}" y="${sy(FW)}" width="${OUTPOST_DOCK*2*SC}" height="${oH.toFixed(1)}"
          fill="rgba(255,220,0,.22)" stroke="#ffe066" stroke-width="1.2"/>`;
  s += `<text x="${(sx(FL-OUTPOST_DOCK)).toFixed(1)}" y="${(sy(FW-OUTPOST_W/2)+4).toFixed(1)}" text-anchor="middle"
          font-family="Arial" font-size="9" fill="#ffe066">OUTPOST</text>`;
  s += `<text x="${(sx(0)-8).toFixed(1)}" y="${sy(0).toFixed(1)}"  text-anchor="end" font-family="Arial" font-size="9" fill="#667">0</text>`;
  s += `<text x="${(sx(0)-8).toFixed(1)}" y="${sy(FW/2).toFixed(1)}" text-anchor="end" font-family="Arial" font-size="9" fill="#667">${(FW/2).toFixed(1)}</text>`;
  s += `<text x="${(sx(0)-8).toFixed(1)}" y="${sy(FW).toFixed(1)}" text-anchor="end" font-family="Arial" font-size="9" fill="#667">${FW}</text>`;
  for (const xv of [0,4,8,12,FL])
    s += `<text x="${sx(xv).toFixed(1)}" y="${(sy(0)+14).toFixed(1)}" text-anchor="middle" font-family="Arial" font-size="9" fill="#667">${xv}</text>`;
  s += `<text x="${(sx(0)-6).toFixed(1)}" y="${sy(FW/2).toFixed(1)}" text-anchor="middle" font-family="Arial" font-size="10" fill="#6688ff"
          transform="rotate(-90 ${(sx(0)-28).toFixed(1)} ${sy(FW/2).toFixed(1)})" dx="-22">BLUE WALL</text>`;
  s += `<text x="${(sx(FL)+6).toFixed(1)}" y="${sy(FW/2).toFixed(1)}" text-anchor="middle" font-family="Arial" font-size="10" fill="#ff6666"
          transform="rotate(90 ${(sx(FL)+28).toFixed(1)} ${sy(FW/2).toFixed(1)})" dx="-22">RED WALL</text>`;
  s += `<text x="${sx(FL/2).toFixed(1)}" y="${(sy(0)+28).toFixed(1)}" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">BOTTOM WALL (Y=0)</text>`;
  s += `<text x="${sx(FL/2).toFixed(1)}" y="${(sy(FW)-8).toFixed(1)}" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">TOP WALL</text>`;
  return s;
}

// ── Draw one set of path segments ─────────────────────────────────────────
// Segment endpoints are computed from DOFF-adjusted circle centres so lines
// always connect to the waypoint circles. SOFF is an additional visual offset
// applied on top (used only to separate overlapping trench passes).
function drawSegments(W, DOFF, SOFF, PH, SEGS, opacity) {
  let s = '';
  for (let i = 0; i < SEGS.length; i++) {
    const [ai, bi, pi] = SEGS[i];
    const ph = PH[pi];
    const xo = SOFF[i].xo, yo = SOFF[i].yo;
    const x1 = sx(W[ai].x) + DOFF[ai].dx + xo;
    const y1 = sy(W[ai].y) + DOFF[ai].dy + yo;
    const x2 = sx(W[bi].x) + DOFF[bi].dx + xo;
    const y2 = sy(W[bi].y) + DOFF[bi].dy + yo;
    const da = ph.dash ? `stroke-dasharray="${ph.dash}"` : '';
    s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
            stroke="${ph.c}" stroke-width="${ph.w}" stroke-linecap="round" ${da} opacity="${opacity}"/>`;
    if (Math.hypot(x2-x1, y2-y1) > 25) s += midArrow(x1, y1, x2, y2, ph.c, xo, yo);
  }
  return s;
}

function drawWaypoints(W, DOFF, PH, rc, route, labelPrefix) {
  let s = '';
  for (let i = W.length-1; i >= 0; i--) {
    if (route === 'outpost-only' && i === 0) continue;
    const w = W[i], ph = PH[w.ph];
    const cx = sx(w.x) + DOFF[i].dx;
    const cy = sy(w.y) + DOFF[i].dy;
    const label = route === 'outpost-only' ? 'OUT' : (labelPrefix ? labelPrefix + i : '' + i);
    s += wpCircle(cx, cy, rc, ph.c, label);
    s += arrow(cx, cy, w.h, 22, ph.c);
  }
  return s;
}

function drawCoordLabels(W, DOFF, route) {
  let s = '';
  for (let i = 0; i < W.length; i++) {
    if (route === 'outpost-only' && i === 0) continue;
    const w = W[i];
    const cx = sx(w.x) + DOFF[i].dx;
    const cy = sy(w.y) + DOFF[i].dy;
    s += `<text x="${cx.toFixed(1)}" y="${(cy-18).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="9" fill="#99aacc" opacity="0.85">(${w.x.toFixed(2)}, ${w.y.toFixed(2)})</text>`;
  }
  return s;
}

// ── Path overlay ──────────────────────────────────────────────────────────
function pathSVG(route, isRed) {
  const W    = getWps(route, isRed);
  const W2   = getWps2(route, isRed);  // cycle 2 (25%) or null
  const DOFF = getDOFF(route, isRed);
  const SOFF = getSOFF(route, isRed);
  let PH, SEGS;
  if (route === 'outpost-only') { PH = PH_OUTPOST_ONLY; SEGS = SEGS_OUTPOST_ONLY; }
  else if (route === 'outpost') { PH = PH_OUTPOST;      SEGS = SEGS_OUTPOST; }
  else                          { PH = PH_CYCLE;        SEGS = SEGS_CYCLE; }
  const rc   = isRed ? '#dd2222' : '#2255dd';
  const rc2  = isRed ? '#882222' : '#224488';  // dimmer for cycle 2
  let s = '';

  // Draw cycle 2 (25% depth) FIRST so cycle 1 draws on top
  if (W2) {
    s += drawSegments(W2, DOFF, SOFF, PH, SEGS, 0.45);
    s += drawWaypoints(W2, DOFF, PH, rc2, route, 'C2:');
    s += drawCoordLabels(W2, DOFF, route);
  }

  // Draw cycle 1 (75% depth) or single path
  s += drawSegments(W, DOFF, SOFF, PH, SEGS, 0.92);

  // ── Dynamic pathfind start marker ──────────────────────────────────────
  const hubX  = isRed ? FL - HUB_DIST : HUB_DIST;
  const spx   = sx(isRed ? hubX + 1.2 : hubX - 1.2);
  const spy   = sy(FW / 2);
  const pCol  = '#ffcc44';

  if (route === 'outpost-only') {
    const w0 = W[0];
    const cx0 = sx(w0.x) + DOFF[0].dx, cy0 = sy(w0.y) + DOFF[0].dy;
    s += `<circle cx="${cx0.toFixed(1)}" cy="${cy0.toFixed(1)}" r="13"
            fill="none" stroke="${pCol}" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>`;
    s += `<text x="${cx0.toFixed(1)}" y="${(cy0+4.5).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="11" font-weight="700" fill="${pCol}" opacity="0.7">S</text>`;
    s += `<text x="${cx0.toFixed(1)}" y="${(cy0-18).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="9" fill="#778" font-style="italic">approx. start</text>`;
  } else {
    const wp0 = W[0];
    const ex0 = sx(wp0.x) + DOFF[0].dx, ey0 = sy(wp0.y) + DOFF[0].dy;
    s += `<line x1="${spx.toFixed(1)}" y1="${spy.toFixed(1)}" x2="${ex0.toFixed(1)}" y2="${ey0.toFixed(1)}"
            stroke="${pCol}" stroke-width="2" stroke-dasharray="8,5" opacity="0.55"/>`;
    s += midArrow(spx, spy, ex0, ey0, pCol, 0, 0);
    s += `<circle cx="${spx.toFixed(1)}" cy="${spy.toFixed(1)}" r="13"
            fill="none" stroke="${pCol}" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>`;
    s += `<text x="${spx.toFixed(1)}" y="${(spy+4.5).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="11" font-weight="700" fill="${pCol}" opacity="0.7">S</text>`;
    s += `<text x="${spx.toFixed(1)}" y="${(spy-18).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="9" fill="#778" font-style="italic">approx. start</text>`;
  }

  // ── Fixed waypoints (cycle 1 / single path) ──────────────────────────
  s += drawWaypoints(W, DOFF, PH, rc, route, W2 ? 'C1:' : '');

  // ── Banner ──────────────────────────────────────────────────────────────
  {
    let bannerText;
    if (route === 'outpost-only') {
      bannerText = 'pathfindToPose — path is dynamically generated by LocalADStar';
    } else if (W2) {
      bannerText = 'Bright = Cycle 1 (75% depth) · Dim = Cycle 2 (25% depth)';
    } else {
      bannerText = 'pathfindThenFollowPath — 75% collection depth';
    }
    const bw = W2 ? 360 : (route === 'outpost-only' ? 310 : 340);
    const nx = sx(FL/2), ny = sy(FW/2) - 22;
    s += `<rect x="${(nx-bw/2).toFixed(1)}" y="${(ny-13).toFixed(1)}" width="${bw}" height="20"
            fill="rgba(0,0,0,.60)" rx="4"/>`;
    s += `<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="10" fill="${pCol}">${bannerText}</text>`;
  }

  // ── Coordinate labels (cycle 1 / single path) ──────────────────────────
  s += drawCoordLabels(W, DOFF, route);

  const kx = sx(FL) - 10, ky = sy(0) + 14;
  s += `<text x="${(kx-55).toFixed(1)}" y="${ky.toFixed(1)}" font-family="Arial" font-size="9" fill="#667">
    Heading: 0°=+X  90°=+Y  180°=−X  −90°=−Y</text>`;
  return s;
}

// ── Legend ────────────────────────────────────────────────────────────────
function buildLegend(route) {
  let PH;
  if (route === 'outpost-only') PH = PH_OUTPOST_ONLY;
  else if (route === 'outpost') PH = PH_OUTPOST;
  else                          PH = PH_CYCLE;
  document.getElementById('legend').innerHTML =
    PH.map(p => `<div class="li">
      <div class="sw" style="${p.dash ? 'background:none;border-top:2px dashed '+p.c : 'background:'+p.c}"></div>
      <span>${p.name}</span></div>`).join('') +
    `<div class="li"><svg width="30" height="22" style="flex-shrink:0">
      <circle cx="11" cy="11" r="10" fill="#2255dd" fill-opacity=".9" stroke="#4a9eff" stroke-width="2"/>
      <line x1="11" y1="11" x2="24" y2="11" stroke="#4a9eff" stroke-width="2.5"/>
      <polygon points="26,11 20,8 20,14" fill="#4a9eff"/>
      <text x="11" y="15" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="white">N</text>
    </svg><span>Circle = robot · arrow = holonomic heading (independent of travel direction)</span></div>`;
}

// ── Table ─────────────────────────────────────────────────────────────────
function buildTable(route, isRed) {
  const W  = getWps(route, isRed);
  const W2 = getWps2(route, isRed);
  const hstr = h =>({0:'0° (+X)', 90:'90° (+Y)', 180:'180° (−X)', [-90]:'−90° (−Y)'}[h] || h+'°');
  let rows = W.map((w, i) =>
    `<tr><td>${W2 ? 'C1:' : ''}${i}</td><td>${w.x.toFixed(3)}</td><td>${w.y.toFixed(3)}</td><td>${hstr(w.h)}</td><td>${w.d}</td></tr>`
  ).join('');
  if (W2) {
    rows += W2.map((w, i) =>
      `<tr style="opacity:0.65"><td>C2:${i}</td><td>${w.x.toFixed(3)}</td><td>${w.y.toFixed(3)}</td><td>${hstr(w.h)}</td><td>${w.d}</td></tr>`
    ).join('');
  }
  document.getElementById('tb').innerHTML = rows;
}

// ── Metadata per route ────────────────────────────────────────────────────
const ROUTE_META = {
  'outpost-only': { title:'OutpostAutoCommand', sub:'No fixed path — pathfindToPose to outpost · deploy intake · shoot on the move · shoot at outpost' },
  'outpost':      { title:'TrenchToOutpostAutoCommand', sub:'10 waypoints · RIGHT trench · 75% collect depth · return sweep offset 5% toward hub · ends at outpost' },
  'cycle-right':  { title:'TrenchCycleAutoCommand — Side.RIGHT', sub:'Cycle 1 = 75% depth · Cycle 2 = 50% depth · return sweep offset 5% toward hub · RIGHT trench (Blue=bottom, Red=top)' },
  'cycle-left':   { title:'TrenchCycleAutoCommand — Side.LEFT',  sub:'Cycle 1 = 75% depth · Cycle 2 = 50% depth · return sweep offset 5% toward hub · LEFT trench  (Blue=top, Red=bottom)' },
};

// ── Render ────────────────────────────────────────────────────────────────
let route = 'outpost-only', alliance = 'blue';

function setRoute(r) {
  route = r;
  document.getElementById('btnOutpostOnly').classList.toggle('active',  r === 'outpost-only');
  document.getElementById('btnOutpost').classList.toggle('active',      r === 'outpost');
  document.getElementById('btnCycleRight').classList.toggle('active',   r === 'cycle-right');
  document.getElementById('btnCycleLeft').classList.toggle('active',    r === 'cycle-left');
  render();
}

function setAlliance(a) {
  alliance = a;
  document.getElementById('btnBlue').classList.toggle('active', a === 'blue');
  document.getElementById('btnRed').classList.toggle('active',  a === 'red');
  render();
}

function render() {
  const isRed = alliance === 'red';
  const meta  = ROUTE_META[route];
  document.getElementById('title').textContent    = meta.title + ' — Team 7840';
  document.getElementById('subtitle').textContent = meta.sub + ' · circles = holonomic heading · numbers = WP index';
  const svg = document.getElementById('field');
  svg.setAttribute('width',  SVG_W);
  svg.setAttribute('height', SVG_H);
  svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
  svg.innerHTML = fieldSVG() + pathSVG(route, isRed);
  buildLegend(route);
  buildTable(route, isRed);
}

render();
</script>
