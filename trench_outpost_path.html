<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TrenchToOutpost Path Visualizer — Team 7840</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #12121e; color: #e0e0e0; padding: 20px; }
h1 { font-size: 1.25em; color: #a8d0ff; margin-bottom: 4px; }
.subtitle { font-size: 0.82em; color: #778; margin-bottom: 14px; }
.controls { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
.btn { padding: 7px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.88em;
       font-weight: 700; letter-spacing: .03em; transition: all .15s; outline: 2px solid transparent; }
.btn-blue  { background: #1e4dcc; color: #fff; }
.btn-blue:hover, .btn-blue.active  { background: #3a7fff; outline-color: #3a7fff; }
.btn-red   { background: #aa1a1a; color: #fff; }
.btn-red:hover,  .btn-red.active   { background: #ff3333; outline-color: #ff3333; }
.note { font-size: 0.78em; color: #778; margin-left: 8px; }
svg { display: block; border-radius: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
.li { display: flex; align-items: center; gap: 7px; font-size: 0.80em; color: #bbb; }
.sw { width: 28px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.sw-dashed { background: repeating-linear-gradient(90deg,#aaa 0,#aaa 5px,transparent 5px,transparent 9px); }
table { margin-top: 16px; border-collapse: collapse; font-size: 0.80em; width: 100%; max-width: 880px; }
th { background: #1e2a40; color: #a8d0ff; padding: 6px 10px; text-align: left; border-bottom: 1px solid #334; }
td { padding: 5px 10px; border-bottom: 1px solid #222; color: #ccc; }
tr:hover td { background: rgba(255,255,255,.04); }
td:first-child { font-weight: 700; color: #fff; }
</style>
</head>
<body>
<h1>TrenchToOutpostAutoCommand — Path Visualization</h1>
<p class="subtitle">9-waypoint path · circles = holonomic heading (arrow direction) · numbers = WP index</p>
<div class="controls">
  <button class="btn btn-blue active" id="btnBlue" onclick="setAlliance('blue')">Blue Alliance</button>
  <button class="btn btn-red"         id="btnRed"  onclick="setAlliance('red')">Red Alliance</button>
  <span class="note">WP 0 = WP 7 and WP 1 = WP 6 share the same field position (shown with slight display offset)</span>
</div>
<svg id="field"></svg>
<div class="legend" id="legend"></div>
<table><thead><tr><th>WP</th><th>Field X (m)</th><th>Field Y (m)</th><th>Heading</th><th>Description</th></tr></thead>
<tbody id="tb"></tbody></table>

<script>
// ── Field constants (meters) ──────────────────────────────────────────────
const FL = 16.54, FW = 8.07;
const HUB_SIDE = 1.1938, HUB_DIST = 3.9651;  // to front face
const TR_DEPTH = 1.194, TR_WIDTH = 1.668, TR_BUF = 0.3;
const NEUT_STAG = 0.40, COLL_CLR = 0.85;
const COLL_DIST = 1.5 * 2.5; // 3.75 m
const OUTPOST_W = 1.253, OUTPOST_DOCK = 0.7;

// ── SVG layout ────────────────────────────────────────────────────────────
const SC = 52, OX = 58, OY = 42;
const SVG_W = OX + FL * SC + 58;
const SVG_H = OY + FW * SC + 42;

function sx(x) { return OX + x * SC; }
function sy(y) { return OY + (FW - y) * SC; }

// ── Waypoints ─────────────────────────────────────────────────────────────
function wps(isRed) {
  const leftH  = isRed ? -90 : 90;
  const oppH   = isRed ? 180 : 0;
  const revH   = isRed ?  90 : -90;   // reversedCollectHeading (180° from leftH)
  const wallH  = isRed ?   0 : 180;   // allianceWallHeading (facing own wall)
  const hubX   = isRed ? FL - (HUB_DIST + HUB_SIDE/2) : HUB_DIST + HUB_SIDE/2;
  const ti     = isRed ? 1 : 0;
  const trCY   = ti === 0 ? TR_WIDTH/2 : FW - TR_WIDTH/2;
  const trHX   = isRed ? hubX + TR_DEPTH/2 + TR_BUF : hubX - TR_DEPTH/2 - TR_BUF;
  const trNX   = isRed ? hubX - TR_DEPTH/2 - TR_BUF : hubX + TR_DEPTH/2 + TR_BUF;
  const nX     = FL / 2;
  const cSY    = isRed ? FW - TR_WIDTH - COLL_CLR : TR_WIDTH + COLL_CLR;
  const cEY    = isRed ? cSY - COLL_DIST : cSY + COLL_DIST;
  const nsX    = isRed ? trNX - NEUT_STAG : trNX + NEUT_STAG;
  const oX     = isRed ? FL - OUTPOST_DOCK : OUTPOST_DOCK;
  const oY     = isRed ? FW - OUTPOST_W/2  : OUTPOST_W/2;
  const oH     = isRed ? 0 : 180;
  return [
    { x:trHX, y:trCY, h:oppH,  ph:0, d:'Hub-side staging — before outbound trench entry' },
    { x:trNX, y:trCY, h:oppH,  ph:1, d:'Neutral-side exit — after outbound trench' },
    { x:nX,   y:cSY,  h:leftH, ph:2, d:'Collection start (facing left wall)' },
    { x:nX,   y:cEY,  h:leftH, ph:2, d:'Collection end — 180° spin begins after this WP' },
    { x:nX,   y:cSY,  h:revH,  ph:3, d:'Collection start (turnaround) — keeps reversed heading from WP3' },
    { x:nsX,  y:trCY, h:wallH, ph:4, d:'Neutral-zone approach staging — alliance wall heading, rollers still running' },
    { x:trNX, y:trCY, h:wallH, ph:5, d:'Return trench entry — alliance wall heading' },
    { x:trHX, y:trCY, h:wallH, ph:6, d:'Hub-side exit — alliance wall heading' },
    { x:oX,   y:oY,   h:oH,    ph:7, d:'Outpost — dock & shoot' },
  ];
}

// ── Phase definitions ─────────────────────────────────────────────────────
const PH = [
  { name:'Outbound trench',         c:'#c0c0c0', w:3,   dash:'10,5' },
  { name:'Transit → collection',    c:'#4a9eff', w:2.5, dash:''     },
  { name:'Collection sweep (out)',   c:'#22dd44', w:2.5, dash:''     },
  { name:'Collection back (reversed heading, rollers on)', c:'#ffbb22', w:2.5, dash:''     },
  { name:'Transit → return trench (alliance wall hdg)',   c:'#ff7722', w:2.5, dash:''     },
  { name:'Approach trench edge (alliance wall hdg)',      c:'#dd44cc', w:2.5, dash:'5,3'  },
  { name:'Return trench',           c:'#c0c0c0', w:3,   dash:'10,5' },
  { name:'Transit → outpost',       c:'#ff4466', w:2.5, dash:''     },
];

// Segment [from_wp, to_wp, phase_idx]
const SEGS = [[0,1,0],[1,2,1],[2,3,2],[3,4,3],[4,5,4],[5,6,5],[6,7,6],[7,8,7]];

// Display offsets so overlapping WPs are visually distinct.
// WP0=WP7, WP1=WP6, WP2=WP4 share field coords.
// The sign of dx/dy flips for Red because the outbound trench direction
// is −X for Red (vs +X for Blue), so "outbound" and "return" are mirrored.
function getDOFF(isRed) {
  // s: outbound-direction sign (+1 = Blue going +X, −1 = Red going −X)
  const s = isRed ? -1 : 1;
  return [
    { dx: -16*s, dy: -8*s },  // WP0  outbound staging  (pushed outbound-side)
    { dx: -16*s, dy: -8*s },  // WP1  neutral-side exit  (pushed outbound-side)
    { dx: -16,   dy:  0   },  // WP2
    { dx:   0,   dy:  0   },  // WP3
    { dx:  16,   dy:  0   },  // WP4
    { dx:   0,   dy:  0   },  // WP5
    { dx:  16*s, dy:  8*s },  // WP6  neutral-side entry (pushed return-side)
    { dx:  16*s, dy:  8*s },  // WP7  hub-side exit      (pushed return-side)
    { dx:   0,   dy:  0   },  // WP8
  ];
}

// ── Drawing helpers ───────────────────────────────────────────────────────
function arrow(cx, cy, hDeg, len, col) {
  const r = hDeg * Math.PI / 180;
  const ex = cx + Math.cos(r) * len, ey = cy - Math.sin(r) * len;
  const pr = r + Math.PI/2, aw = 4.5;
  const bx = ex - Math.cos(r)*8, by = ey + Math.sin(r)*8;
  const pts = [
    [ex, ey],
    [bx + Math.cos(pr)*aw, by - Math.sin(pr)*aw],
    [bx - Math.cos(pr)*aw, by + Math.sin(pr)*aw],
  ].map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"
            stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>
          <polygon points="${pts}" fill="${col}"/>`;
}

function wpCircle(cx, cy, col, phaseCol, n) {
  const r = 13;
  return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}"
            fill="${col}" fill-opacity="0.88" stroke="${phaseCol}" stroke-width="2.2"/>
          <text x="${cx.toFixed(1)}" y="${(cy+4.5).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="11" font-weight="700" fill="white">${n}</text>`;
}

function midArrow(x1, y1, x2, y2, col, xo, yo) {
  const mx = (x1+x2)/2+xo, my = (y1+y2)/2+yo;
  const ang = Math.atan2(-(y2-y1), x2-x1);
  const ex = mx + Math.cos(ang)*7, ey = my - Math.sin(ang)*7;
  const pr = ang+Math.PI/2, aw = 3.5;
  const bx = mx - Math.cos(ang)*5, by = my + Math.sin(ang)*5;
  const pts = [[ex,ey],[bx+Math.cos(pr)*aw,by-Math.sin(pr)*aw],[bx-Math.cos(pr)*aw,by+Math.sin(pr)*aw]]
    .map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<polygon points="${pts}" fill="${col}" opacity="0.9"/>`;
}

// ── Static field elements ─────────────────────────────────────────────────
function fieldSVG() {
  const hubXb = HUB_DIST + HUB_SIDE/2, hubXr = FL - hubXb;
  const hh = HUB_SIDE/2 * SC;
  let s = '';

  // background
  s += `<rect x="${sx(0)}" y="${sy(FW)}" width="${FL*SC}" height="${FW*SC}"
          fill="#2a4a35" stroke="#fff" stroke-width="2"/>`;

  // alliance zones
  s += `<rect x="${sx(0)}" y="${sy(FW)}" width="${(hubXb-HUB_SIDE/2)*SC}" height="${FW*SC}"
          fill="rgba(40,80,200,.18)"/>`;
  s += `<rect x="${sx(hubXr+HUB_SIDE/2)}" y="${sy(FW)}" width="${(FL-hubXr-HUB_SIDE/2)*SC}" height="${FW*SC}"
          fill="rgba(200,40,40,.18)"/>`;

  // center line
  s += `<line x1="${sx(FL/2)}" y1="${sy(FW)}" x2="${sx(FL/2)}" y2="${sy(0)}"
          stroke="rgba(255,255,255,.18)" stroke-width="1" stroke-dasharray="7,5"/>`;

  // hubs
  for (const [hx, lbl] of [[hubXb,'HUB B'],[hubXr,'HUB R']]) {
    const rx = sx(hx) - hh, ry = sy(FW/2) - hh;
    s += `<rect x="${rx.toFixed(1)}" y="${ry.toFixed(1)}" width="${(HUB_SIDE*SC).toFixed(1)}" height="${(HUB_SIDE*SC).toFixed(1)}"
            fill="#555" stroke="#999" stroke-width="1.5"/>`;
    s += `<text x="${sx(hx).toFixed(1)}" y="${(sy(FW/2)+4).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="10" fill="#bbb">${lbl}</text>`;
  }

  // 4 trenches (2 per alliance, bottom + top)
  for (const hx of [hubXb, hubXr]) {
    for (const cy of [TR_WIDTH/2, FW-TR_WIDTH/2]) {
      const tx = sx(hx - TR_DEPTH/2);
      const tw = TR_DEPTH * SC;
      const ty = sy(cy + TR_WIDTH/2);
      const th = TR_WIDTH * SC;
      s += `<rect x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" width="${tw.toFixed(1)}" height="${th.toFixed(1)}"
              fill="#2a2a2a" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>`;
      s += `<text x="${(tx+tw/2).toFixed(1)}" y="${(ty+th/2+4).toFixed(1)}" text-anchor="middle"
              font-family="Arial" font-size="9" fill="#888">TRENCH</text>`;
    }
  }

  // outposts (Blue: bottom-left, Red: top-right)
  const oH = OUTPOST_W * SC;
  // Blue outpost
  s += `<rect x="${sx(0)}" y="${sy(OUTPOST_W)}" width="${OUTPOST_DOCK*2*SC}" height="${oH.toFixed(1)}"
          fill="rgba(255,220,0,.22)" stroke="#ffe066" stroke-width="1.2"/>`;
  s += `<text x="${(sx(0)+OUTPOST_DOCK*SC).toFixed(1)}" y="${(sy(OUTPOST_W/2)+4).toFixed(1)}" text-anchor="middle"
          font-family="Arial" font-size="9" fill="#ffe066">OUTPOST</text>`;
  // Red outpost
  s += `<rect x="${sx(FL-OUTPOST_DOCK*2)}" y="${sy(FW)}" width="${OUTPOST_DOCK*2*SC}" height="${oH.toFixed(1)}"
          fill="rgba(255,220,0,.22)" stroke="#ffe066" stroke-width="1.2"/>`;
  s += `<text x="${(sx(FL-OUTPOST_DOCK)).toFixed(1)}" y="${(sy(FW-OUTPOST_W/2)+4).toFixed(1)}" text-anchor="middle"
          font-family="Arial" font-size="9" fill="#ffe066">OUTPOST</text>`;

  // axis labels
  s += `<text x="${(sx(0)-8).toFixed(1)}" y="${sy(0).toFixed(1)}" text-anchor="end"
          font-family="Arial" font-size="9" fill="#667">0</text>`;
  s += `<text x="${(sx(0)-8).toFixed(1)}" y="${sy(FW/2).toFixed(1)}" text-anchor="end"
          font-family="Arial" font-size="9" fill="#667">${(FW/2).toFixed(1)}</text>`;
  s += `<text x="${(sx(0)-8).toFixed(1)}" y="${sy(FW).toFixed(1)}" text-anchor="end"
          font-family="Arial" font-size="9" fill="#667">${FW}</text>`;
  for (const xv of [0, 4, 8, 12, FL]) {
    s += `<text x="${sx(xv).toFixed(1)}" y="${(sy(0)+14).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="9" fill="#667">${xv}</text>`;
  }
  // wall labels
  s += `<text x="${(sx(0)-6).toFixed(1)}" y="${sy(FW/2).toFixed(1)}" text-anchor="middle"
          font-family="Arial" font-size="10" fill="#6688ff"
          transform="rotate(-90 ${(sx(0)-28).toFixed(1)} ${sy(FW/2).toFixed(1)})"
          dx="-22">BLUE WALL</text>`;
  s += `<text x="${(sx(FL)+6).toFixed(1)}" y="${sy(FW/2).toFixed(1)}" text-anchor="middle"
          font-family="Arial" font-size="10" fill="#ff6666"
          transform="rotate(90 ${(sx(FL)+28).toFixed(1)} ${sy(FW/2).toFixed(1)})"
          dx="-22">RED WALL</text>`;
  s += `<text x="${sx(FL/2).toFixed(1)}" y="${(sy(0)+28).toFixed(1)}" text-anchor="middle"
          font-family="Arial" font-size="10" fill="#888">BOTTOM WALL (Y=0)</text>`;
  s += `<text x="${sx(FL/2).toFixed(1)}" y="${(sy(FW)-8).toFixed(1)}" text-anchor="middle"
          font-family="Arial" font-size="10" fill="#888">TOP WALL</text>`;

  return s;
}

// ── Path overlay ──────────────────────────────────────────────────────────
function pathSVG(isRed) {
  const W = wps(isRed);
  const DOFF = getDOFF(isRed);
  const rc = isRed ? '#dd2222' : '#2255dd';
  let s = '';

  // Segment path offsets to visually separate overlapping routes
  // Outbound trench (0→1) and return trench (6→7) overlap in Y → offset them
  // Collection out (2→3) and back (3→4) overlap in X → offset them
  const SOFF = [
    { xo:0,  yo: 6  },  // 0→1  outbound trench: shift toward wall
    { xo:0,  yo: 0  },  // 1→2
    { xo:-8, yo: 0  },  // 2→3  collect out: offset left
    { xo: 8, yo: 0  },  // 3→4  collect back: offset right
    { xo: 0, yo: 0  },  // 4→5
    { xo: 0, yo: 0  },  // 5→6
    { xo: 0, yo:-6  },  // 6→7  return trench: shift away from wall
    { xo: 0, yo: 0  },  // 7→8
  ];

  // Draw path lines
  for (let i = 0; i < SEGS.length; i++) {
    const [ai, bi] = SEGS[i];
    const ph = PH[SEGS[i][2]];
    const xo = SOFF[i].xo, yo = SOFF[i].yo;
    const x1 = sx(W[ai].x)+xo, y1 = sy(W[ai].y)+yo;
    const x2 = sx(W[bi].x)+xo, y2 = sy(W[bi].y)+yo;
    const da = ph.dash ? `stroke-dasharray="${ph.dash}"` : '';
    s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
            stroke="${ph.c}" stroke-width="${ph.w}" stroke-linecap="round" ${da} opacity="0.92"/>`;
    if (Math.hypot(x2-x1, y2-y1) > 25)
      s += midArrow(x1, y1, x2, y2, ph.c, xo, yo);
  }

  // Draw robots (back to front so WP0 renders on top of WP7, etc.)
  for (let i = W.length-1; i >= 0; i--) {
    const w = W[i], ph = PH[w.ph];
    const cx = sx(w.x) + DOFF[i].dx;
    const cy = sy(w.y) + DOFF[i].dy;
    s += wpCircle(cx, cy, rc, ph.c, i);
    s += arrow(cx, cy, w.h, 22, ph.c);
  }

  // Coordinate labels (near each WP, avoid overlap with circle)
  for (let i = 0; i < W.length; i++) {
    const w = W[i];
    const cx = sx(w.x) + DOFF[i].dx;
    const cy = sy(w.y) + DOFF[i].dy;
    // offset label above circle
    const ldy = -18;
    s += `<text x="${cx.toFixed(1)}" y="${(cy+ldy).toFixed(1)}" text-anchor="middle"
            font-family="Arial" font-size="9" fill="#99aacc" opacity="0.85">(${w.x.toFixed(2)}, ${w.y.toFixed(2)})</text>`;
  }

  // Heading compass key (bottom-right corner)
  const kx = sx(FL) - 10, ky = sy(0) + 14;
  s += `<text x="${(kx-55).toFixed(1)}" y="${ky.toFixed(1)}" font-family="Arial" font-size="9" fill="#667">
    Heading: 0°=+X  90°=+Y  180°=−X  −90°=−Y</text>`;

  return s;
}

// ── Legend ────────────────────────────────────────────────────────────────
function buildLegend() {
  const leg = document.getElementById('legend');
  leg.innerHTML = PH.map(p => `
    <div class="li">
      <div class="sw" style="background:${p.c};height:3px;${p.dash?'background:none;border-top:2px dashed '+p.c:''}"></div>
      <span>${p.name}</span>
    </div>`).join('') +
  `<div class="li"><svg width="30" height="22" style="flex-shrink:0">
    <circle cx="11" cy="11" r="10" fill="#2255dd" fill-opacity=".9" stroke="#4a9eff" stroke-width="2"/>
    <line x1="11" y1="11" x2="24" y2="11" stroke="#4a9eff" stroke-width="2.5"/>
    <polygon points="26,11 20,8 20,14" fill="#4a9eff"/>
    <text x="11" y="15" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="white">N</text>
  </svg><span>Circle = robot · arrow = holonomic heading (independent of direction of travel)</span></div>`;
}

// ── WP table ──────────────────────────────────────────────────────────────
function buildTable(isRed) {
  const W = wps(isRed);
  const hstr = h => ({0:'0° (+X)', 90:'90° (+Y)', 180:'180° (−X)', [-90]:'−90° (−Y)'}[h] || h+'°');
  document.getElementById('tb').innerHTML = W.map((w, i) => `
    <tr>
      <td>${i}</td>
      <td>${w.x.toFixed(3)}</td>
      <td>${w.y.toFixed(3)}</td>
      <td>${hstr(w.h)}</td>
      <td>${w.d}</td>
    </tr>`).join('');
}

// ── Render ────────────────────────────────────────────────────────────────
let alliance = 'blue';
function setAlliance(a) {
  alliance = a;
  document.getElementById('btnBlue').classList.toggle('active', a === 'blue');
  document.getElementById('btnRed').classList.toggle('active',  a === 'red');
  render();
}

function render() {
  const svg = document.getElementById('field');
  svg.setAttribute('width',  SVG_W);
  svg.setAttribute('height', SVG_H);
  svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
  svg.innerHTML = fieldSVG() + pathSVG(alliance === 'red');
  buildTable(alliance === 'red');
}

buildLegend();
render();
</script>
</body>
</html>
