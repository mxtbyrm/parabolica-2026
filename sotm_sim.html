{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─────────────────────────────────────────────────────────────
// CONSTANTS  (frc.robot.Constants.java exact values)
// ─────────────────────────────────────────────────────────────
const IN = 0.0254; // inches → meters
const C = {
  // Physics
  GRAVITY:           9.81,
  DRAG_CD:           0.47,
  AIR_RHO:           1.225,
  FUEL_RADIUS:       5.91/2 * IN,      // 0.07506 m
  FUEL_MASS:         0.215,

  // Shooter
  FW_GEAR_RATIO:     1.5,
  FW_WHEEL_RADIUS:   2.0 * IN,         // 0.0508 m
  FW_EFFICIENCY:     0.745,
  HOOD_MIN:          27.5,             // deg
  HOOD_MAX:          42.5,             // deg
  HOOD_TOL:          1.0,              // deg
  FW_TOL_RPS:        2.0,
  LAUNCH_H:          16.5 * IN,        // 0.4191 m
  RIM_MARGIN:        0.05,             // m

  // Hub geometry
  HUB_RIM_H:         72.0 * IN,        // 1.8288 m
  HUB_CTR_H:         58.125 * IN,      // 1.4764 m
  HUB_OD:            41.7 * IN,        // 1.0592 m
  HUB_BASE:          47.0 * IN,        // 1.1938 m
  HUB_WALL:          156.06 * IN,      // 3.9651 m

  // Field
  FIELD_L:           651.2 * IN,       // 16.54 m
  FIELD_W:           317.7 * IN,       // 8.07 m

  // SOTM
  DEADBAND:          0.05,             // m/s — stationary threshold
  SOTM_VEL_ALPHA:    0.40,             // EMA alpha for velocity/omega
  TURRET_TOL:        1.0,              // deg

  // Turret pivot offset from robot center (mirrors Constants.java Turret class)
  // OFFSET_X = -0.15 m  → 15 cm rearward  (WPILib robot +X = forward)
  // OFFSET_Y = -0.15 m  → 15 cm rightward (WPILib robot +Y = left)
  OFFSET_X:         -0.15,
  OFFSET_Y:         -0.15,

  // Solver
  MIN_D:             1.5,
  MAX_D:             7.0,
  SIM_DT:            0.010,
  BIN_ITERS:         35,
  ANG_ITERS:         30,
  MAX_STEPS:         5000,
  MAX_V0:            30.0,
  PRE_STEP:          0.05,
};
C.BALL_AREA = Math.PI * C.FUEL_RADIUS * C.FUEL_RADIUS;
C.DRAG_K    = (0.5 * C.DRAG_CD * C.AIR_RHO * C.BALL_AREA) / C.FUEL_MASS;
C.HEX_R     = C.HUB_OD / Math.sqrt(3.0);
C.HUB_X     = C.HUB_WALL + C.HUB_BASE / 2.0;  // 4.562 m
C.HUB_Y     = C.FIELD_W / 2.0;                 // 4.035 m

const toRad = d => d * Math.PI / 180;
const toDeg = r => r * 180 / Math.PI;
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));

// ─────────────────────────────────────────────────────────────
// PHYSICS  (port of ShooterKinematics.java)
// ─────────────────────────────────────────────────────────────
function rpmToV0(rpm) {
  return (rpm / C.FW_GEAR_RATIO) * (2*Math.PI) * C.FW_WHEEL_RADIUS * C.FW_EFFICIENCY / 60;
}
function v0ToRPM(v0) {
  return v0 * 60 * C.FW_GEAR_RATIO / (2*Math.PI * C.FW_WHEEL_RADIUS * C.FW_EFFICIENCY);
}
function exitAngle(hoodDeg) { return 90 - hoodDeg; }  // ball exit angle deg

// Euler simulation — height at targetX
function simH(v0, thetaRad, targetX) {
  let vx = v0*Math.cos(thetaRad), vy = v0*Math.sin(thetaRad);
  let x = 0, y = C.LAUNCH_H;
  for (let s = 0; s < C.MAX_STEPS; s++) {
    if (y < 0 || vx <= 0) return -Infinity;
    const xp = x, yp = y, spd = Math.sqrt(vx*vx+vy*vy);
    const ax = -C.DRAG_K*spd*vx, ay = -C.GRAVITY - C.DRAG_K*spd*vy;
    x += vx*C.SIM_DT; y += vy*C.SIM_DT; vx += ax*C.SIM_DT; vy += ay*C.SIM_DT;
    if (x >= targetX) { const f=(targetX-xp)/(x-xp); return yp+f*(y-yp); }
  }
  return y;
}

// Height at targetX with explicit vx0, vy0 (for SOTM ground-frame)
function simHcomp(vx0, vy0, targetX) {
  let vx = vx0, vy = vy0, x = 0, y = C.LAUNCH_H;
  for (let s = 0; s < C.MAX_STEPS; s++) {
    if (y < 0 || vx <= 0) return -Infinity;
    const xp=x, yp=y, spd=Math.sqrt(vx*vx+vy*vy);
    const ax=-C.DRAG_K*spd*vx, ay=-C.GRAVITY-C.DRAG_K*spd*vy;
    x+=vx*C.SIM_DT; y+=vy*C.SIM_DT; vx+=ax*C.SIM_DT; vy+=ay*C.SIM_DT;
    if (x >= targetX) { const f=(targetX-xp)/(x-xp); return yp+f*(y-yp); }
  }
  return y;
}

// Flight time with explicit components
function simT(vx0, vy0, targetX) {
  let vx=vx0, vy=vy0, x=0, y=C.LAUNCH_H, t=0;
  for (let s=0; s<C.MAX_STEPS; s++) {
    if (y<0||vx<=0) break;
    const xp=x, spd=Math.sqrt(vx*vx+vy*vy);
    const ax=-C.DRAG_K*spd*vx, ay=-C.GRAVITY-C.DRAG_K*spd*vy;
    x+=vx*C.SIM_DT; y+=vy*C.SIM_DT; vx+=ax*C.SIM_DT; vy+=ay*C.SIM_DT; t+=C.SIM_DT;
    if (x >= targetX) { const f=(targetX-xp)/(x-xp); return (t-C.SIM_DT)+f*C.SIM_DT; }
  }
  return t;
}

// Min launch speed to reach targetH at targetX
function minV0(thetaRad, targetX, targetH) {
  if (simH(C.MAX_V0, thetaRad, targetX) < targetH) return C.MAX_V0;
  let lo=0, hi=C.MAX_V0;
  for (let i=0; i<C.BIN_ITERS; i++) {
    const m=(lo+hi)/2;
    if (simH(m, thetaRad, targetX) >= targetH) hi=m; else lo=m;
  }
  return hi;
}

// Vacuum parabola initial angle guess
function vacuumHood(dRim, hRim, dCenter, hCenter) {
  const h0=C.LAUNCH_H, d1=hRim-h0, d2=hCenter-h0;
  const det=dRim*dCenter*(dRim-dCenter);
  const b=(dRim*dRim*d2 - dCenter*dCenter*d1)/det;
  return 90 - toDeg(Math.atan(b));
}

function hAtCenterForHood(hood, dRim, hClr, dCenter) {
  const tr=toRad(exitAngle(hood)), v0=minV0(tr, dRim, hClr);
  if (v0 >= C.MAX_V0) return -Infinity;
  return simH(v0, tr, dCenter);
}

function physicsSetpoint(dist) {
  const dRimN = Math.max(0.1, dist - C.HEX_R);
  const dRim  = dRimN / Math.cos(toRad(C.TURRET_TOL));
  const hClr  = C.HUB_RIM_H + C.FUEL_RADIUS + C.RIM_MARGIN;
  const hCenter = C.HUB_CTR_H;

  const vacH = vacuumHood(dRim, hClr, dist, hCenter);
  let lo = clamp(vacH-10, C.HOOD_MIN, C.HOOD_MAX);
  let hi = clamp(vacH+10, C.HOOD_MIN, C.HOOD_MAX);
  let hoodDeg = vacH;

  const hLo = hAtCenterForHood(lo, dRim, hClr, dist);
  const hHi = hAtCenterForHood(hi, dRim, hClr, dist);
  if (hLo <= hCenter && hHi >= hCenter) {
    for (let i=0; i<C.ANG_ITERS; i++) {
      const m=(lo+hi)/2;
      if (hAtCenterForHood(m, dRim, hClr, dist) < hCenter) lo=m; else hi=m;
    }
    hoodDeg = (lo+hi)/2;
  }
  hoodDeg = clamp(hoodDeg, C.HOOD_MIN, C.HOOD_MAX);

  const hL = clamp(hoodDeg-C.HOOD_TOL, C.HOOD_MIN, C.HOOD_MAX);
  const hH = clamp(hoodDeg+C.HOOD_TOL, C.HOOD_MIN, C.HOOD_MAX);
  const vTol = rpmToV0(C.FW_TOL_RPS*60);
  let wV0 = 0;
  for (const h of [hL, hoodDeg, hH]) {
    wV0 = Math.max(wV0, minV0(toRad(exitAngle(h)), dRim, hClr));
  }
  const robustV0 = wV0 + vTol;
  if (robustV0 >= C.MAX_V0) return { rpm:0, hood:C.HOOD_MIN, valid:false };
  return { rpm: v0ToRPM(robustV0), hood: hoodDeg, valid: true };
}

// Precompute tables
const TBL_RPM=[], TBL_HOOD=[], TBL_D=[];
function precompute() {
  for (let d=C.MIN_D; d<=C.MAX_D+1e-9; d+=C.PRE_STEP) {
    const sp = physicsSetpoint(d);
    TBL_D.push(d); TBL_RPM.push(sp.rpm); TBL_HOOD.push(sp.hood);
  }
}

function lerp(a,b,t){return a+t*(b-a)}
function tableGet(tbl, dist) {
  const d = clamp(dist, C.MIN_D, C.MAX_D);
  const idx = (d - C.MIN_D) / C.PRE_STEP;
  const lo = Math.floor(idx), hi = Math.min(lo+1, tbl.length-1);
  return lerp(tbl[lo], tbl[hi], idx-lo);
}

function calc(dist) {
  return { rpm: tableGet(TBL_RPM, dist), hood: clamp(tableGet(TBL_HOOD, dist), C.HOOD_MIN, C.HOOD_MAX) };
}

function vH(sp) {
  return rpmToV0(sp.rpm) * Math.cos(toRad(exitAngle(sp.hood)));
}

// Binary-search the vertical launch speed that makes the ball reach HUB_CTR_H
// at horizontal distance d with ground-frame horizontal speed vH.
// This gives the correct arc for the visualization when robot is moving —
// vizVy0 from calc(dFire) is wrong for the actual ground-frame trajectory.
function computeVizVy0(vH, d) {
  if (vH <= 0.01) return 5;
  const target = C.HUB_CTR_H;
  let lo = 0, hi = 16;
  // If even max vy0 can't reach target at d, return hi (best effort)
  if (simHcomp(vH, hi, d) < target) return hi;
  for (let i = 0; i < 30; i++) {
    const m = (lo + hi) / 2;
    if (simHcomp(vH, m, d) > target) hi = m; else lo = m;
  }
  return (lo + hi) / 2;
}

// ─────────────────────────────────────────────────────────────
// SOTM SOLVER  (exact ShootCommand.java position-prediction logic)
//
// Three-step algorithm (mirrors ShootCommand.java execute()):
//   1. Base setpoint at current distance → drag-aware flight time (tof)
//   2. Predict hub position at fire time: hubNow − pivotVelocity × tof
//      pivotVelocity includes omega × offset cross-term (same as Java)
//   3. Final setpoint at effective distance |prediction|
//      Turret aims at atan2(fireY, fireX) — lateral lead is implicit
// ─────────────────────────────────────────────────────────────
function sotm(rx, ry, heading, vx, vy, omega) {
  const hubX = C.HUB_X, hubY = C.HUB_Y;

  // Hub vector from robot in field frame
  const relX = hubX - rx, relY = hubY - ry;
  const dist  = Math.sqrt(relX*relX + relY*relY);
  const spd   = Math.sqrt(vx*vx + vy*vy);
  const stationary = spd < C.DEADBAND && Math.abs(omega) < 0.3;

  // ── Turret pivot velocity in field frame ────────────────────────────────
  // Java (robot frame): vxT = vx - omega*OFFSET_Y,  vyT = vy + omega*OFFSET_X
  // Here everything is in field frame, so the offset must be rotated first.
  //   Robot forward in field: (cos h,  sin h)
  //   Robot left   in field:  (-sin h, cos h)
  //   pivotOff_field = OFFSET_X*(cos h, sin h) + OFFSET_Y*(-sin h, cos h)
  //   2-D cross (XY, CCW omega+): omega × pivotOff = (-omega*off_y, omega*off_x)
  const oh        = heading;
  const offX_fld  = C.OFFSET_X*Math.cos(oh) - C.OFFSET_Y*Math.sin(oh);
  const offY_fld  = C.OFFSET_X*Math.sin(oh) + C.OFFSET_Y*Math.cos(oh);
  const vxT = vx - omega * offY_fld;   // pivot velocity, field X
  const vyT = vy + omega * offX_fld;   // pivot velocity, field Y

  let dFire, alphaFireRad, sp, tof = 0;

  if (stationary) {
    // Static: aim directly at current hub angle, setpoint at current distance
    dFire        = clamp(dist, C.MIN_D, C.MAX_D);
    alphaFireRad = Math.atan2(relY, relX);
    sp           = calc(dFire);
  } else {
    // ── Step 1: drag-aware tof from base setpoint at current distance ──────
    const dNow   = clamp(dist, C.MIN_D, C.MAX_D);
    const spBase = calc(dNow);
    const v0b    = rpmToV0(spBase.rpm);
    const thB    = toRad(exitAngle(spBase.hood));
    tof          = simT(v0b*Math.cos(thB), v0b*Math.sin(thB), dNow);

    // ── Step 2: hub position relative to pivot at fire time ─────────────────
    // The pivot moves (vxT, vyT)×tof during ball flight.
    // Subtracting from the current hub vector gives where the hub will be
    // relative to the pivot when the ball arrives.
    const fireX = relX - vxT * tof;
    const fireY = relY - vyT * tof;

    // ── Step 3: effective distance and turret angle (lead implicit) ─────────
    dFire        = clamp(Math.sqrt(fireX*fireX + fireY*fireY), C.MIN_D, C.MAX_D);
    alphaFireRad = Math.atan2(fireY, fireX);

    // ── Step 4: final setpoint at effective distance ────────────────────────
    sp = calc(dFire);
  }

  const turretFieldDeg = toDeg(alphaFireRad);
  const hubFieldDeg    = toDeg(Math.atan2(relY, relX));
  const leadDeg        = turretFieldDeg - hubFieldDeg;

  const v0f    = rpmToV0(sp.rpm);
  const thF    = toRad(exitAngle(sp.hood));
  const vx0F   = v0f * Math.cos(thF);
  const tFlight = simT(vx0F, v0f * Math.sin(thF), dFire);

  // ── Ground-frame ball velocity ─────────────────────────────────────────────
  // Muzzle exits in turret direction (alphaFireRad); robot pivot adds (vxT, vyT).
  // Ground-frame direction ≈ toward hub; ground-frame speed > muzzle speed.
  const vxG        = vx0F * Math.cos(alphaFireRad) + vxT;
  const vyG        = vx0F * Math.sin(alphaFireRad) + vyT;
  const vH_ground  = Math.sqrt(vxG*vxG + vyG*vyG);
  const alpha_gnd  = Math.atan2(vyG, vxG);

  // vizVy0: vertical component that makes the ball reach HUB_CTR_H at the
  // actual ground-frame distance (dist). vizVy0 from calc(dFire) is WRONG
  // here because vH_ground ≠ vx0F and dist ≠ dFire — causes misses.
  const vizVy0 = stationary
    ? v0f * Math.sin(thF)           // stationary: dFire=dist, vH=vx0F → correct
    : computeVizVy0(vH_ground, dist); // SOTM: binary-search for correct vy0

  return {
    dist, dFire, dFireC: dFire,
    tof, leadDeg,
    rpm: sp.rpm, hood: sp.hood,
    exitDeg: exitAngle(sp.hood),
    tFlight,
    vx0Total: vH_ground,         // ground-frame horizontal speed
    vizVy0,                       // corrected vertical for actual trajectory
    turretFieldDeg,
    hubFieldDeg,
    hubFireDeg: toDeg(alpha_gnd), // ground-frame direction (≈ toward hub)
    firePx: rx, firePy: ry,       // ball exits from current robot position
    turretRobotDeg: toDeg(alphaFireRad - heading),
    stationary,
    vxT, vyT,
  };
}

// Trajectory point array for visualization
function trajPts(vx0, vy0) {
  const pts=[];
  let vx=vx0, vy=vy0, x=0, y=C.LAUNCH_H;
  for (let s=0; s<C.MAX_STEPS; s++) {
    pts.push({x,y});
    if (y<0||vx<=0) break;
    const spd=Math.sqrt(vx*vx+vy*vy);
    const ax=-C.DRAG_K*spd*vx, ay=-C.GRAVITY-C.DRAG_K*spd*vy;
    x+=vx*C.SIM_DT; y+=vy*C.SIM_DT; vx+=ax*C.SIM_DT; vy+=ay*C.SIM_DT;
    if (y<-0.3) break;
  }
  return pts;
}

// ─────────────────────────────────────────────────────────────
// THREE.JS SCENE
// ─────────────────────────────────────────────────────────────
const container = document.getElementById('three');
const renderer  = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x0d1117);
container.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, 1, 0.05, 120);
camera.position.set(C.HUB_X+5, 11, C.HUB_Y+9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(C.HUB_X, 1, C.HUB_Y);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

scene.add(new THREE.AmbientLight(0x334455, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(8,18,6); sun.castShadow=true;
scene.add(sun);

// Field floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(C.FIELD_L, C.FIELD_W),
  new THREE.MeshLambertMaterial({color:0x1a2618})
);
floor.rotation.x = -Math.PI/2;
floor.position.set(C.FIELD_L/2, 0, C.FIELD_W/2);
floor.receiveShadow = true;
scene.add(floor);

// Field grid
const grid = new THREE.GridHelper(Math.ceil(Math.max(C.FIELD_L,C.FIELD_W)), 20, 0x21262d, 0x21262d);
grid.position.set(C.FIELD_L/2, 0.002, C.FIELD_W/2);
scene.add(grid);

// Alliance wall lines
function addLine(pts, color) {
  const geo = new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(...p)));
  scene.add(new THREE.Line(geo, new THREE.LineBasicMaterial({color})));
}
addLine([[0,0.01,0],[C.FIELD_L,0.01,0],[C.FIELD_L,0.01,C.FIELD_W],[0,0.01,C.FIELD_W],[0,0.01,0]], 0x30363d);
addLine([[0,0.01,C.FIELD_W/2],[C.FIELD_L,0.01,C.FIELD_W/2]], 0x21262d);

// Hub
function buildHub() {
  const g = new THREE.Group();
  g.position.set(C.HUB_X, 0, C.HUB_Y);

  // Tower
  const tH = C.HUB_RIM_H;
  const tower = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25,0.25,tH,6),
    new THREE.MeshLambertMaterial({color:0x5a4030})
  );
  tower.position.y = tH/2;
  g.add(tower);

  // Rim (gold ring at top)
  const R = C.HUB_OD/2, thick=0.04;
  const shape = new THREE.Shape();
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/6;i===0?shape.moveTo(R*Math.cos(a),R*Math.sin(a)):shape.lineTo(R*Math.cos(a),R*Math.sin(a));}
  shape.closePath();
  const hole = new THREE.Path();
  const Ri=R-thick;
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/6;i===0?hole.moveTo(Ri*Math.cos(a),Ri*Math.sin(a)):hole.lineTo(Ri*Math.cos(a),Ri*Math.sin(a));}
  hole.closePath(); shape.holes.push(hole);
  const rimMesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshLambertMaterial({color:0xd4a017,side:THREE.DoubleSide}));
  rimMesh.rotation.x = -Math.PI/2; rimMesh.position.y = C.HUB_RIM_H;
  g.add(rimMesh);

  // Rim outline
  const rimPts = Array.from({length:7},(_,i)=>{const a=i/6*Math.PI*2-Math.PI/6;return new THREE.Vector3(R*Math.cos(a),C.HUB_RIM_H+0.01,R*Math.sin(a));});
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rimPts), new THREE.LineBasicMaterial({color:0xffd700})));

  // Hub center target ring (blue)
  const cR=0.12;
  const cPts=Array.from({length:25},(_,i)=>{const a=i/24*Math.PI*2;return new THREE.Vector3(cR*Math.cos(a),C.HUB_CTR_H,cR*Math.sin(a));});
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(cPts), new THREE.LineBasicMaterial({color:0x58a6ff})));

  return g;
}
scene.add(buildHub());

// Robot group
const robotG = new THREE.Group();
// Body
const body = new THREE.Mesh(new THREE.BoxGeometry(0.65,0.28,0.65), new THREE.MeshLambertMaterial({color:0x1565c0}));
body.position.y = 0.14; body.castShadow=true;
robotG.add(body);
// Front indicator (red)
const front = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.29,0.65), new THREE.MeshLambertMaterial({color:0xc62828}));
front.position.set(0.285,0.14,0); robotG.add(front);
// Turret base
const tBase = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.09,12), new THREE.MeshLambertMaterial({color:0x37474f}));
tBase.position.y = 0.33; robotG.add(tBase);
// Turret pivot group
const turretPivot = new THREE.Group();
turretPivot.position.y = 0.37;
// Barrel: cylinder pointing along +X initially
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.55,8), new THREE.MeshLambertMaterial({color:0xf57f17}));
barrel.rotation.z = Math.PI/2; barrel.position.x = 0.275;

// Dynamic scene objects (recreated each frame)
let dynObjects = [];
function clearDyn() { dynObjects.forEach(o=>scene.remove(o)); dynObjects=[]; }
function addDyn(obj) { scene.add(obj); dynObjects.push(obj); }

function mkLine(pts3, color, linewidth=1) {
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts3),
    new THREE.LineBasicMaterial({color, linewidth})
  );
}

// Animated ball state
let animBall=null, animPts=[], animIdx=0, animDirX=1, animDirZ=0, animBaseX=0, animBaseZ=0;
function startBallAnim(s) {
  if(animBall){scene.remove(animBall);animBall=null;}
  // Ball leaves from current robot position, travels along turret aim direction.
  const fa=toRad(s.hubFireDeg);
  animDirX=Math.cos(fa); animDirZ=Math.sin(fa);
  animBaseX=s.firePx; animBaseZ=s.firePy;
  animPts=trajPts(s.vx0Total, s.vizVy0);
  animIdx=0;
  animBall=new THREE.Mesh(new THREE.SphereGeometry(C.FUEL_RADIUS,10,7), new THREE.MeshLambertMaterial({color:0xf97316,emissive:0x662200}));
  animBall.position.set(s.firePx,C.LAUNCH_H,s.firePy);
  scene.add(animBall);
}

// ─────────────────────────────────────────────────────────────
// 2D TRAJECTORY CANVAS
// ─────────────────────────────────────────────────────────────
const tCanvas = document.getElementById('trajCanvas');
const tCtx    = tCanvas.getContext('2d');
const TW=tCanvas.width, TH=tCanvas.height;

function drawTraj(s) {
  tCtx.fillStyle='#0d1117'; tCtx.fillRect(0,0,TW,TH);
  if(!s) return;

  // vx0Total is now the ground-frame horizontal speed; ball reaches the real hub
  const vx0 = s.vx0Total;
  const vy0 = s.vizVy0;
  const pts = trajPts(vx0, vy0);

  // Side-view: x-axis shows ground-frame distance (dist), not dFire
  const dC  = s.dist;
  const maxX = dC + 1.2, maxY = C.HUB_RIM_H + 0.6;
  const PAD_L=28, PAD_B=18, PAD_R=8, PAD_T=8;
  const pW=TW-PAD_L-PAD_R, pH=TH-PAD_T-PAD_B;
  const cx=(x)=>PAD_L+(x/maxX)*pW;
  const cy=(y)=>TH-PAD_B-((y/maxY)*pH);

  // Grid
  tCtx.strokeStyle='#1a1f27'; tCtx.lineWidth=1;
  for(let y=0;y<=maxY;y+=0.5){tCtx.beginPath();tCtx.moveTo(PAD_L,cy(y));tCtx.lineTo(TW-PAD_R,cy(y));tCtx.stroke();}
  for(let x=0;x<=maxX;x+=1){tCtx.beginPath();tCtx.moveTo(cx(x),PAD_T);tCtx.lineTo(cx(x),TH-PAD_B);tCtx.stroke();}

  // Y axis labels
  tCtx.fillStyle='#8b949e'; tCtx.font='8px Courier New'; tCtx.textAlign='right';
  for(let y=0;y<=2.5;y+=0.5) tCtx.fillText(y.toFixed(1),PAD_L-2,cy(y)+3);

  // Hub rim (gold)
  tCtx.strokeStyle='#ffd700'; tCtx.lineWidth=2;
  tCtx.beginPath();
  tCtx.moveTo(cx(dC-C.HEX_R),cy(C.HUB_RIM_H));
  tCtx.lineTo(cx(dC+C.HEX_R),cy(C.HUB_RIM_H));
  tCtx.stroke();

  // Clearance line (red dashed)
  const clrH=C.HUB_RIM_H+C.FUEL_RADIUS+C.RIM_MARGIN;
  tCtx.strokeStyle='#f85149'; tCtx.lineWidth=1;
  tCtx.setLineDash([3,3]);
  tCtx.beginPath();
  tCtx.moveTo(cx(dC-C.HEX_R),cy(clrH));
  tCtx.lineTo(cx(dC+C.HEX_R),cy(clrH));
  tCtx.stroke();
  tCtx.setLineDash([]);

  // Hub center (blue dot)
  tCtx.fillStyle='#58a6ff';
  tCtx.beginPath(); tCtx.arc(cx(dC),cy(C.HUB_CTR_H),3,0,Math.PI*2); tCtx.fill();
  tCtx.fillText('hub', cx(dC)+5, cy(C.HUB_CTR_H)+3);

  // Hub center H dashed
  tCtx.strokeStyle='#1e3a5f'; tCtx.setLineDash([2,4]);
  tCtx.beginPath(); tCtx.moveTo(PAD_L,cy(C.HUB_CTR_H)); tCtx.lineTo(TW-PAD_R,cy(C.HUB_CTR_H)); tCtx.stroke();
  tCtx.setLineDash([]);

  // Launch height line
  tCtx.strokeStyle='#2d4a2d'; tCtx.setLineDash([2,4]);
  tCtx.beginPath(); tCtx.moveTo(PAD_L,cy(C.LAUNCH_H)); tCtx.lineTo(TW-PAD_R,cy(C.LAUNCH_H)); tCtx.stroke();
  tCtx.setLineDash([]);

  // Trajectory
  tCtx.strokeStyle='#ffd700'; tCtx.lineWidth=2;
  tCtx.beginPath();
  let started=false;
  for(const p of pts) {
    const pcx=cx(p.x), pcy=cy(Math.max(0,p.y));
    if(!started){tCtx.moveTo(pcx,pcy);started=true;} else tCtx.lineTo(pcx,pcy);
  }
  tCtx.stroke();

  // Distance label
  tCtx.fillStyle='#8b949e'; tCtx.textAlign='center'; tCtx.font='8px Courier New';
  tCtx.fillText(dC.toFixed(2)+'m', cx(dC), TH-2);
  tCtx.fillText(s.stationary?'dist':'dist (ground)', cx(dC), TH-11);
  tCtx.textAlign='left';
}

// ─────────────────────────────────────────────────────────────
// TELEMETRY
// ─────────────────────────────────────────────────────────────
function updateTelem(s) {
  const f=(v,d=2)=>v===undefined?'—':v.toFixed(d);
  const row=(lbl,val,cls='')=>`<div class="tr"><span class="tl">${lbl}</span><span class="tv ${cls}">${val}</span></div>`;
  const warnV=(v,t)=>Math.abs(v)>t?'warn':'';
  document.getElementById('telem').innerHTML = [
    row('Dist to Hub (now)',  f(s.dist)+'m'),
    row('dFire (effective)',  f(s.dFire)+'m', s.dFire!==s.dist?'warn':''),
    row('tof (base setpoint)',f(s.tof,3)+'s'),
    '<hr class="sep">',
    row('Hub Angle (field)',   f(s.hubFieldDeg)+'°'),
    row('Turret Angle (field)',f(s.turretFieldDeg)+'°'),
    row('Lead Angle (implicit)',f(s.leadDeg)+'°', warnV(s.leadDeg,1)?'warn':''),
    row('Turret (robot frame)',f(s.turretRobotDeg)+'°'),
    '<hr class="sep">',
    row('Flywheel RPM', f(s.rpm,0)),
    row('Hood Angle',   f(s.hood)+'°'),
    row('Ball Exit Angle', f(s.exitDeg)+'°'),
    '<hr class="sep">',
    row('vx0 (ground radial)', f(s.vx0Total)+' m/s'),
    row('tFlight (final sp)',  f(s.tFlight,3)+'s'),
    row('Pivot Vel X (field)', f(s.vxT)+' m/s', warnV(s.vxT,0.1)),
    row('Pivot Vel Y (field)', f(s.vyT)+' m/s', warnV(s.vyT,0.1)),
    '<hr class="sep">',
    row('Mode', s.stationary?'<span class="green">STATIONARY</span>':'<span class="warn">SOTM ACTIVE</span>', ''),
  ].join('');
}

// ─────────────────────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────────────────────
const state = {
  rx: C.HUB_X + 3.5, ry: C.HUB_Y,
  heading: Math.PI,
  vx: 0, vy: 0, omega: 0,
  // EMA internals — position/heading deltas → filtered velocity/omega
  _prevRx: C.HUB_X + 3.5, _prevRy: C.HUB_Y,
  _prevHeading: Math.PI,
  _vEmaX: 0, _vEmaY: 0, _vEmaOmega: 0,
};

function addSlider(id, label, min, max, val, step, fmt, onChange) {
  const ctrl = document.getElementById('ctrl');
  const d = document.createElement('div'); d.className='cg';
  d.innerHTML=`<label>${label}</label><div class="sr"><input type="range" id="${id}" min="${min}" max="${max}" value="${val}" step="${step}"><span class="sv" id="${id}_v">${fmt(val)}</span></div>`;
  ctrl.appendChild(d);
  d.querySelector('input').addEventListener('input', e=>{
    const v=parseFloat(e.target.value);
    document.getElementById(id+'_v').textContent=fmt(v);
    onChange(v);
  });
}

const f1=(v)=>v.toFixed(1)+' m/s';
const f2=(v)=>v.toFixed(2)+' m';
const f3=(v)=>v.toFixed(0)+'°/s';
const f4=(v)=>v.toFixed(0)+'°';
const f5=(v)=>v.toFixed(2)+' m';

addSlider('vx',   'Vx (field, EMA α=0.40) [read-only]',      -4,   4,   0, 0.05, f1, ()=>{});
addSlider('vy',   'Vy (field, EMA α=0.40) [read-only]',      -4,   4,   0, 0.05, f1, ()=>{});
addSlider('omega','Omega (deg/s, EMA α=0.40) [read-only]', -360, 360,   0, 5,    f3, ()=>{});
// vx, vy, omega are all EMA-derived from movement — display-only
['vx','vy','omega'].forEach(id=>{
  const el=document.getElementById(id);
  if(el){el.style.accentColor='#3fb950';el.style.opacity='0.6';el.style.pointerEvents='none';}
});
addSlider('heading','Robot Heading (deg, field CCW+)',-180,180,toDeg(state.heading),5,f4,v=>state.heading=toRad(v));
addSlider('rx','Robot X position (m)',C.HUB_X+C.MIN_D,C.HUB_X+C.MAX_D,state.rx,0.05,f5,v=>state.rx=v);
addSlider('ry','Robot Y position (m)',0.5,C.FIELD_W-0.5,state.ry,0.05,f5,v=>state.ry=v);

const btn=document.createElement('button');
btn.id='fireBtn'; btn.textContent='🔥 FIRE — animate ball';
document.getElementById('ctrl').appendChild(btn);

// Click on field plane to reposition robot
const raycaster=new THREE.Raycaster(), mouse2=new THREE.Vector2();
const fieldPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
renderer.domElement.addEventListener('pointerdown', e=>{
  if(e.button!==0) return;
  const rect=renderer.domElement.getBoundingClientRect();
  mouse2.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse2.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse2,camera);
  const pt=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(fieldPlane,pt)){
    state.rx=clamp(pt.x,0,C.FIELD_L);
    state.ry=clamp(pt.z,0,C.FIELD_W);
    const rx2=document.getElementById('rx'), ry2=document.getElementById('ry');
    if(rx2){rx2.value=state.rx; document.getElementById('rx_v').textContent=f5(state.rx);}
    if(ry2){ry2.value=state.ry; document.getElementById('ry_v').textContent=f5(state.ry);}
  }
});

let lastSOTM=null;
btn.addEventListener('click',()=>{ if(lastSOTM) startBallAnim(lastSOTM); });

// ─────────────────────────────────────────────────────────────
// KEYBOARD CONTROLS
// ─────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(e.code==='Space'){ e.preventDefault(); if(lastSOTM) startBallAnim(lastSOTM); }
  if(['ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

const KEY_MOVE_SPEED = 3.0;   // m/s robot movement via WASD
const KEY_ROT_SPEED  = 120.0; // deg/s heading via arrow keys

function applyKeyControls(dt) {
  // WASD — move in field frame
  let moved=false;
  if(keys['KeyW']){ state.ry -= KEY_MOVE_SPEED*dt; moved=true; }  // W = −Y (toward bottom of field)
  if(keys['KeyS']){ state.ry += KEY_MOVE_SPEED*dt; moved=true; }  // S = +Y
  if(keys['KeyA']){ state.rx -= KEY_MOVE_SPEED*dt; moved=true; }  // A = −X (toward blue wall)
  if(keys['KeyD']){ state.rx += KEY_MOVE_SPEED*dt; moved=true; }  // D = +X (away from hub)
  state.rx = clamp(state.rx, 0.3, C.FIELD_L-0.3);
  state.ry = clamp(state.ry, 0.3, C.FIELD_W-0.3);
  if(moved){
    const rx2=document.getElementById('rx'), ry2=document.getElementById('ry');
    if(rx2){rx2.value=state.rx.toFixed(2); document.getElementById('rx_v').textContent=f5(state.rx);}
    if(ry2){ry2.value=state.ry.toFixed(2); document.getElementById('ry_v').textContent=f5(state.ry);}
  }
  // Arrow keys — rotate heading
  if(keys['ArrowLeft']){
    state.heading += toRad(KEY_ROT_SPEED)*dt;
    const h2=document.getElementById('heading');
    if(h2){h2.value=toDeg(state.heading).toFixed(0); document.getElementById('heading_v').textContent=f4(toDeg(state.heading));}
  }
  if(keys['ArrowRight']){
    state.heading -= toRad(KEY_ROT_SPEED)*dt;
    const h2=document.getElementById('heading');
    if(h2){h2.value=toDeg(state.heading).toFixed(0); document.getElementById('heading_v').textContent=f4(toDeg(state.heading));}
  }
}

// ─────────────────────────────────────────────────────────────
// RESIZE
// ─────────────────────────────────────────────────────────────
function onResize() {
  const W=container.clientWidth, H=container.clientHeight;
  renderer.setSize(W,H);
  camera.aspect=W/H; camera.updateProjectionMatrix();
}
window.addEventListener('resize',onResize); onResize();

// ─────────────────────────────────────────────────────────────
// ANIMATE
// ─────────────────────────────────────────────────────────────
let lastT=performance.now();

function frame() {
  requestAnimationFrame(frame);
  const now=performance.now(), dt=Math.min((now-lastT)/1000, 0.05);
  lastT=now;

  // Snapshot before key movement so we can compute deltas
  state._prevRx      = state.rx;
  state._prevRy      = state.ry;
  state._prevHeading = state.heading;

  applyKeyControls(dt);

  // Derive velocity and omega from position/heading deltas, EMA-filtered
  // (mirrors the EMA in ShootCommand.java, α = SOTM_VEL_ALPHA = 0.40)
  if(dt > 0) {
    const α = C.SOTM_VEL_ALPHA;
    const rawVx    = (state.rx      - state._prevRx)      / dt;
    const rawVy    = (state.ry      - state._prevRy)      / dt;
    const rawOmega = (state.heading - state._prevHeading) / dt;
    state._vEmaX     = α*rawVx    + (1-α)*state._vEmaX;
    state._vEmaY     = α*rawVy    + (1-α)*state._vEmaY;
    state._vEmaOmega = α*rawOmega + (1-α)*state._vEmaOmega;
    state.vx    = state._vEmaX;
    state.vy    = state._vEmaY;
    state.omega = state._vEmaOmega;
    // Update display sliders
    const vxEl=document.getElementById('vx'), vyEl=document.getElementById('vy');
    const omEl=document.getElementById('omega');
    if(vxEl){vxEl.value=clamp(state.vx,-4,4); document.getElementById('vx_v').textContent=f1(state.vx);}
    if(vyEl){vyEl.value=clamp(state.vy,-4,4); document.getElementById('vy_v').textContent=f1(state.vy);}
    if(omEl){omEl.value=clamp(toDeg(state.omega),-360,360); document.getElementById('omega_v').textContent=f3(toDeg(state.omega));}
  }

  // Update robot
  robotG.position.set(state.rx, 0, state.ry);
  robotG.rotation.y = -state.heading;

  // SOTM — pass omega derived from heading rate
  const s=sotm(state.rx, state.ry, state.heading, state.vx, state.vy, state.omega);
  lastSOTM=s;

  // Turret rotation (robot-frame)
  turretPivot.rotation.y = state.heading - toRad(s.turretFieldDeg);

  // Clear dynamic lines
  clearDyn();

  // Hub direction line (green)
  const ha=toRad(s.hubFieldDeg), ta=toRad(s.turretFieldDeg);
  const len=Math.min(s.dFire*0.85, 5);
  addDyn(mkLine([
    new THREE.Vector3(state.rx,0.5,state.ry),
    new THREE.Vector3(state.rx+len*Math.cos(ha),0.5,state.ry+len*Math.sin(ha))
  ], 0x3fb950));

  // Turret aim line (orange)
  addDyn(mkLine([
    new THREE.Vector3(state.rx,0.55,state.ry),
    new THREE.Vector3(state.rx+len*Math.cos(ta),0.55,state.ry+len*Math.sin(ta))
  ], 0xf57f17));

  // Lead angle arc
  if(!s.stationary) {
    const arcR=Math.min(len*0.35,1.2), steps=24;
    const arcPts=Array.from({length:steps+1},(_,i)=>{
      const a=ha+(ta-ha)*i/steps;
      return new THREE.Vector3(state.rx+arcR*Math.cos(a),0.52,state.ry+arcR*Math.sin(a));
    });
    addDyn(mkLine(arcPts,0xf0883e));
  }

  // Velocity arrow
  const spd=Math.sqrt(state.vx*state.vx+state.vy*state.vy);
  if(spd>0.05) {
    const arr=new THREE.ArrowHelper(
      new THREE.Vector3(state.vx/spd,0,state.vy/spd),
      new THREE.Vector3(state.rx,0.55,state.ry),
      clamp(spd*0.5,0.1,2.5), 0x3fb950, 0.15, 0.08
    );
    addDyn(arr);
  }

  // Precomputed 3D trajectory line
  // Starts from fire position (not current position) so the endpoint lands at hub
  // regardless of direction. Moving backward: fire position is farther from hub,
  // trajectory calibrated for dFire → endpoint at hub. ✓
  {
    const vx0=s.vx0Total;  // ground-frame radial speed (same as static at dFireC)
    const vy0=s.vizVy0;    // vertical component (same as static)
    const fa=toRad(s.hubFireDeg);  // hub direction from fire position
    const pts=trajPts(vx0,vy0);
    const pts3=pts.map(p=>new THREE.Vector3(
      s.firePx+p.x*Math.cos(fa),
      p.y,
      s.firePy+p.x*Math.sin(fa)
    ));
    if(pts3.length>1) addDyn(mkLine(pts3,0xffd700));
  }

  // Animate ball
  if(animBall) {
    animIdx++;
    if(animIdx<animPts.length) {
      const p=animPts[animIdx];
      animBall.position.set(animBaseX+p.x*animDirX, Math.max(0,p.y), animBaseZ+p.x*animDirZ);
    } else {
      scene.remove(animBall); animBall=null;
    }
  }

  // Update UI
  updateTelem(s);
  drawTraj(s);

  controls.update();
  renderer.render(scene,camera);
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
document.getElementById('statusBar').textContent='Precomputing drag-aware shooter tables… (35 binary-search iters × 111 distances)';

// Run precompute off main thread via setTimeout so status bar renders
setTimeout(()=>{
  const t0=performance.now();
  precompute();
  const ms=(performance.now()-t0).toFixed(0);
  document.getElementById('statusBar').textContent=
    `Tables ready: ${TBL_D.length} entries in ${ms}ms | WASD = move robot · ←→ = rotate · SPACE = fire | Click field to place robot | Drag to orbit camera`;
  frame();
}, 20);
